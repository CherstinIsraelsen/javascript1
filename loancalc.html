<!DOCTYPE html>
<html>
<head>
<title>Loan Payment Calculator</title>

<style>
    /* Styling for a calm, professional interface */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f4f8; /* Soft, calm background */
        color: #334155; /* Dark slate text for readability */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    
    .calculator-card {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); /* Soft shadow */
        max-width: 400px;
        width: 100%;
    }

    h3 {
        margin-top: 0;
        text-align: center;
        color: #1e293b;
        font-size: 24px;
        margin-bottom: 25px;
    }

    .input-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
    }

    label {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #475569;
    }

    input {
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 16px;
        transition: border-color 0.2s;
    }

    input:focus {
        outline: none;
        border-color: #2c7a7b; /* Muted teal focus outline */
    }

    button {
        width: 100%;
        padding: 14px;
        background-color: #2c7a7b; /* Calm, professional teal */
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s;
    }

    button:hover {
        background-color: #235f5f;
    }

    .result-container {
        margin-top: 25px;
        padding: 15px;
        background-color: #e2e8f0;
        border-radius: 6px;
        text-align: center;
        font-size: 15px;
        line-height: 1.6;
        min-height: 24px;
    }

    /* Makes the bolded numbers pop a bit more */
    strong {
        color: #0f172a;
        font-size: 1.1em;
    }
</style>

<script>
function calc()
{
    let PV = document.getElementById("presval").value;
    let r = document.getElementById("apr").value;
    let n = document.getElementById("yrs").value;
    let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
    
    // Wrapped the variables in <strong> tags to bold the numbers
    document.getElementById("ans").innerHTML = "If you take a loan for $<strong>" + PV + "</strong> over the span of <strong>" + n + "</strong> years at an interest rate of <strong>" + r + "</strong>%, your monthly payment will be: $<strong>" + P.toFixed(2) + "</strong>";
}
</script>
  
</head>
<body>

<div class="calculator-card">
    <h3>Loan Payment Calculator</h3>
    
    <div class="input-group">
        <label for="presval">Present Value (amount you wish to borrow)</label>
        <input type="number" id="presval" placeholder="e.g. 5000">
    </div>
    
    <div class="input-group">
        <label for="yrs">Years</label>
        <input type="number" id="yrs" placeholder="e.g. 5">
    </div>
    
    <div class="input-group">
        <label for="apr">% (annual percentage rate)</label>
        <input type="number" id="apr" step="0.01" placeholder="e.g. 4.5">
    </div>
    
    <button onclick="calc()"> Calculate the Monthly Payment </button>
    
    <div class="result-container">
        <span id="ans"> Enter your details above to see your payment. </span>
    </div>
</div>
  
</body>
</html>
